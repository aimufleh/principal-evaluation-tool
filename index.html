<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقييم أداء مدير المدرسة</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#f5f7f9;
  --card:#ffffff;

  /* الهوية الجديدة */
  --primary:#15445a;        /* كحلي رسمي */
  --primary-dark:#0f3444;   /* أغمق قليلاً */
  --accent:#07a869;         /* أخضر الهوية */
  --secondary:#3d7eb9;      /* أزرق مساعد */

  --border:#c2c1c1;
  --text:#1c2b36;
  --muted:#6b7c86;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); font-family:"Segoe UI", Tahoma, sans-serif; color:var(--text);}
.container{padding:16px; max-width:1200px; margin:0 auto}
.grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  align-items: stretch;
}.card{background:var(--card); border:1.5px solid var(--border); border-radius:10px; padding:10px 12px; min-height:84px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;}
.card:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:0 6px 18px rgba(7,168,105,.18);
}
.icon{width:28px; height:28px; border-radius:6px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:16px; flex:none;}
.card h3{margin:0; font-size:14px; line-height:1.4; color:color:#15445a; font-weight:700;}
.weight{font-size:14px; color:var(--muted); margin-top:4px}
.card{
  height: 100%;
  align-items: flex-start;
}
.panel{margin-top:16px; background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:14px; display:none;}
.panel.active{display:block}
.panel-header{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.panel-header h2{margin:0; font-size:16px; color:var(--primary-dark)}
.desc{background:#f7fbff; border:1px dashed var(--border); padding:12px; border-radius:8px; color:#243545; line-height:1.7; font-size:17px;}

.scale{margin-top:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.scale-label{font-size:14px; color:var(--muted); margin-inline-end:8px}
.scale button{width:40px; height:40px; border-radius:10px; border:1.5px solid var(--border); background:#fff; color:var(--primary-dark); font-weight:700; cursor:pointer; transition:all .15s ease;}
.scale button:hover{ border-color:var(--accent); box-shadow:0 4px 10px rgba(10,94,168,.15)}
.scale button.active{ background:var(--primary); color:#fff; border-color:var(--accent)}

.level-desc{
  margin-top:10px;
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:16px 18px;
  font-size:16px;
  line-height:2.2;

  border-right:4px solid var(--primary); /* 👈 هذا هنا */
}
	.level-title{font-weight:700; color:var(--primary-dark); margin-bottom:6px}

.tips{margin-top:14px; font-size:16px; color:var(--muted)}

/* ⭐⭐⭐ تنسيق تفسير المستوى ⭐⭐⭐ */
.evidence-box {
  margin-top: 14px;
  background: #ffffff;
  border: 1.5px solid var(--border);
  padding: 12px;
  border-radius: 10px;
}
.evidence-title {
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 10px;
}
.evidence-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.evidence-tag {
  background: #eef5ff;
  border: 1px solid #d5e4ff;
  color: #084b86;
  padding: 6px 12px;
  font-size: 14px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
}
	

/* ⭐⭐⭐ تنسيق النقاط داخل desc ⭐⭐⭐ */
.desc-list {
  margin: 0;
  padding-right: 20px;
  list-style: none;
  line-height: 1.9;
}
.desc-list li {
  margin-bottom: 6px;
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  direction: rtl;
}
.level-line{
  font-size:17px;
  line-height:2.3;
  margin-bottom:14px;
  padding:8px 14px;
  border-radius:10px;
  font-weight:600;
}

.level-line::before{
  content:"⭐";
  position:absolute;
  right:0;
  top:0;
}
	.desc-list li::before {
  content: "* ";
  color: var(--primary-dark);
  font-weight: 900;
}
/* ====== HEADER (شعار يمين + عنوان يسار) ====== */
.site-header{
  background: linear-gradient(135deg,#15445a,#07a869);
  color:#fff;
  padding: 22px 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 18px;
  direction:ltr; /* توزيع الأعمدة */
}

/* اليسار: العنوان + العنوان الفرعي */
.header-left{
  flex: 1;
  display:flex;
  flex-direction:column;
  gap:6px;
  text-align:center;
  direction:rtl; /* العربية صحيحة داخل العمود */
}

/* اليمين: الشعار */
.header-right{
  flex: 0 0 auto;
  display:flex;
  align-items:center;
  justify-content:flex-end;
}

/* الشعار */
.header-logo{
  height:120px; /* تقدرين تخلينها 140 إذا تبين */
  width:auto;
  display:block;
}

/* العنوان */
.header-title{
  margin:0;
  font-size:24px;
  font-weight:900;
  letter-spacing:.2px;
}

/* العنوان الفرعي */
.header-sub{
  margin:0;
  font-size:14px;
  opacity:.85;
  line-height:1.6;
}

/* موبايل */
@media (max-width:640px){
  .site-header{
    padding: 18px 16px;
  }
  .header-logo{ height:90px; }
  .header-title{ font-size:20px; }
}

</style>
</head>

</div>

      evidence: [
        "خطط واضحة لتحسين البيئة المدرسية",

      evidence: [

// إنشاء البطاقات
const cardsWrap = document.getElementById("cards");
items.forEach((item, index)=>{
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.index = index;
  card.innerHTML = `
      <div class="icon">${item.icon}</div>
      <div>
        <h3>${item.title}</h3>
        <div class="weight">الوزن النسبي: ${item.weight}</div>
      </div>
  `;
  card.onclick = ()=> openPanel(index);
  cardsWrap.appendChild(card);
});

const panel = document.getElementById("panel");
const panelTitle = document.getElementById("panelTitle");
const panelWeight = document.getElementById("panelWeight");
const panelDesc = document.getElementById("panelDesc");
const levelText = document.getElementById("levelText");
const levelTitleEl = document.querySelector(".level-title");
const scaleButtons = [...document.querySelectorAll(".scale button")];

function openPanel(index){
  const item = items[index];

  panelTitle.textContent = item.title;
  panelWeight.textContent = `الوزن النسبي: ${item.weight}`;

  // تحويل الوصف إلى قائمة
  panelDesc.innerHTML = `
    <ul class="desc-list">
      ${item.desc.split("\n").map(l => `<li>${l.trim()}</li>`).join("")}
    </ul>
  `;

  setActiveLevel(1, item);

  panel.classList.add("active");

  scaleButtons.forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.level==="1");
    btn.onclick = ()=>{
      scaleButtons.forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      setActiveLevel(Number(btn.dataset.level), item);
    };
  });

  panel.scrollIntoView({behavior:"smooth"});
}

function setActiveLevel(level, item){
  const levelData = item.scale[level];

  // عنوان المستوى
  levelTitleEl.textContent = `وصف المستوى ${level}`;

  // نحول النص إلى أسطر تبدأ كلها بنجمة ⭐
  const lines = levelData.text
    .replace(/^\s*>/gm, "*")      // يحول > إلى *
    .split("*")                   // تقسيم على *
    .map(t => t.trim())
    .filter(Boolean);

  // عرض الأسطر ملونة
 const gradients = [
  "linear-gradient(90deg,#e6f4ff,#ffffff)",
  "linear-gradient(90deg,#e8fff3,#ffffff)",
  "linear-gradient(90deg,#fff7e6,#ffffff)",
  "linear-gradient(90deg,#f3e8ff,#ffffff)",
  "linear-gradient(90deg,#e6fffb,#ffffff)"
];

levelText.innerHTML = lines
  .map((line, i) =>
    `<div class="level-line" 
      style="background:${gradients[i % gradients.length]};
             border-right:4px solid var(--primary-dark);">
       ⭐ ${line}
     </div>`
  )
  .join("");
  // تفسيرات المستوى
//  loadEvidence(levelData.evidence);
}

function loadEvidence(list){
  const box = document.getElementById("evidenceBox");
  const wrap = document.getElementById("evidenceTags");

  if(!list || list.length === 0){
    box.style.display = "none";
    return;
  }

  wrap.innerHTML = "";
  list.forEach(ev=>{
    const tag = document.createElement("div");
    tag.className = "evidence-tag";
    tag.textContent = ev;
    wrap.appendChild(tag);
  });

  box.style.display = "block";
}

</script>
</body>
</html>
